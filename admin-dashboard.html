<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>管理者ページ ｜ GIFTED×GIFT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  #adminGate { max-width: 360px; margin: 120px auto; text-align: center; padding: 0 20px; }
  #adminGate input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); margin: 16px 0; font-family: var(--font-body); background: var(--cream-card); color: var(--ink); }
  #adminDashboard { display: none; }
  .admin-toolbar { display: flex; gap: 12px; align-items: center; margin: 24px 0; flex-wrap: wrap; }
  .admin-toolbar input[type="search"] { flex: 1; min-width: 200px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); font-family: var(--font-body); background: var(--cream-card); color: var(--ink); }
  .admin-count { font-size: 0.85rem; color: var(--ink-soft); }
  .admin-card { background: var(--cream-card); border: 1px solid var(--line); border-radius: 20px; padding: 22px 24px; margin-bottom: 14px; }
  .admin-card.is-handled { opacity: 0.5; }
  .admin-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .admin-page-tag { font-size: 0.75rem; font-weight: 700; color: var(--gold-deep); background: var(--cream); padding: 4px 12px; border-radius: 999px; }
  .admin-date { font-size: 0.78rem; color: var(--ink-soft); }
  .admin-email { font-size: 0.88rem; color: var(--gold-deep); margin-bottom: 8px; word-break: break-all; }
  .admin-detail { background: var(--cream); border-radius: 12px; padding: 4px 14px; margin-bottom: 8px; }
  .admin-category { padding: 10px 0; }
  .admin-category + .admin-category { border-top: 1px solid var(--line); }
  .admin-category-name { font-size: 0.85rem; font-weight: 700; color: var(--gold-deep); margin-bottom: 6px; }
  .admin-field-row { display: flex; justify-content: space-between; gap: 16px; font-size: 0.85rem; padding: 3px 0; }
  .admin-field-label { color: var(--ink-soft); flex-shrink: 0; }
  .admin-field-value { color: var(--ink); text-align: right; }
  .admin-notes { font-size: 0.85rem; color: var(--ink-soft); }
  .admin-check { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--ink-soft); margin-top: 10px; }
  .admin-state { text-align: center; color: var(--ink-soft); padding: 60px 20px; }
  .admin-error { color: #E2694A; }

  .admin-partner-panel { margin-bottom: 8px; }
  .admin-partner-label { font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 6px; }
  .admin-partner-links { display: flex; flex-wrap: wrap; gap: 8px; }
  .admin-partner-link {
    font-size: 0.8rem; font-weight: 700; color: var(--gold-deep);
    background: var(--cream); border-radius: 999px; padding: 6px 14px;
    text-decoration: none;
  }
  .admin-partner-link:hover { background: #2A241D; }

  .admin-plan-panel { background: var(--cream); border-radius: 12px; padding: 16px; margin-top: 12px; }
  .admin-plan-field { display: block; font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 12px; }
  .admin-plan-field input, .admin-plan-field select { display: block; width: 100%; margin-top: 4px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); font-family: inherit; background: var(--cream-card); color: var(--ink); }
  .admin-plan-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  .admin-plan-table th { text-align: left; font-size: 0.75rem; color: var(--ink-soft); padding: 4px 6px; }
  .admin-plan-table td { padding: 3px; }
  .admin-plan-table input { width: 100%; padding: 7px 8px; border-radius: 6px; border: 1px solid var(--line); font-family: inherit; font-size: 0.85rem; background: var(--cream-card); color: var(--ink); }
  .plan-row-remove { border: none; background: none; color: var(--ink-soft); cursor: pointer; font-size: 1rem; padding: 0 6px; }
  .admin-plan-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }

  .admin-shiori-panel { background: var(--cream); border-radius: 12px; padding: 16px; margin-top: 12px; border: 1px dashed var(--line); }
  .admin-shiori-panel h4 { font-size: 0.92rem; margin-bottom: 12px; }
  .admin-shiori-panel textarea { display: block; width: 100%; margin-top: 4px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); font-family: inherit; background: var(--cream-card); color: var(--ink); resize: vertical; }

  .admin-email-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    width: 100%;
    background: var(--cream-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 20px;
    margin-bottom: 10px;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s ease;
  }
  .admin-email-row:hover { background: #2A241D; }
  .admin-email-row-email { font-size: 0.95rem; font-weight: 700; color: var(--gold-deep); word-break: break-all; }
  .admin-email-row-meta { font-size: 0.78rem; color: var(--ink-soft); flex-shrink: 0; white-space: nowrap; }
  .admin-back-btn { margin-bottom: 16px; }

  .admin-quick-panel { background: var(--cream-card); border: 1px solid var(--line); border-radius: 20px; padding: 20px 22px; margin: 24px 0; }
  .admin-quick-panel h3 { font-size: 1rem; margin-bottom: 4px; }
  .admin-quick-panel .admin-quick-sub { font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 14px; }
  .admin-quick-row {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--cream);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 8px;
    font-family: inherit;
    cursor: pointer;
  }
  .admin-quick-row:hover { background: #2A241D; }
  .admin-quick-row:last-child { margin-bottom: 0; }
  .admin-quick-top { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .admin-quick-email { font-size: 0.85rem; font-weight: 700; color: var(--gold-deep); word-break: break-all; }
  .admin-quick-date { font-size: 0.75rem; color: var(--ink-soft); flex-shrink: 0; white-space: nowrap; }
  .admin-quick-notes { font-size: 0.85rem; color: var(--ink); white-space: pre-wrap; }
</style>
</head>
<body>

<div id="adminGate">
  <h1>管理者ページ</h1>
  <p>パスワードを入力してください。</p>
  <input type="password" id="adminPassword" placeholder="パスワード">
  <button type="button" class="btn btn-primary" id="adminLoginBtn" style="width:100%;">ログイン</button>
</div>

<div id="adminDashboard">
  <div class="wrap">
    <header class="header-inner" style="padding-top:24px;">
      <h1 style="font-size:1.3rem;">ご相談・依頼一覧</h1>
      <button type="button" class="btn btn-outline" id="reloadBtn">再読み込み</button>
    </header>

    <div id="quickContactArea"></div>

    <div class="admin-toolbar">
      <input type="search" id="searchInput" placeholder="ページ・メールアドレス・内容で検索">
      <span class="admin-count" id="countBadge"></span>
    </div>

    <div id="listArea">
      <div class="admin-state">読み込み中です…</div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
  var allItems = [];
  var currentEmail = null;
  var handledIds = JSON.parse(localStorage.getItem('gitedgift_admin_handled') || '[]');

  document.getElementById('adminLoginBtn').addEventListener('click', function () {
    var input = document.getElementById('adminPassword').value.trim();
    if (input !== SITE_CONFIG.ADMIN_SECRET) {
      alert('パスワードが違います。');
      return;
    }
    document.getElementById('adminGate').style.display = 'none';
    document.getElementById('adminDashboard').style.display = 'block';
    loadSubmissions();
  });

  document.getElementById('reloadBtn').addEventListener('click', loadSubmissions);

  function loadSubmissions() {
    document.getElementById('listArea').innerHTML = '<div class="admin-state">読み込み中です…</div>';

    if (!SITE_CONFIG.SUBMISSION_ENDPOINT || SITE_CONFIG.SUBMISSION_ENDPOINT.indexOf('script.google.com') === -1) {
      document.getElementById('listArea').innerHTML =
        '<div class="admin-state admin-error">config.js の SUBMISSION_ENDPOINT がまだ設定されていません。Apps ScriptのURLを設定してください。</div>';
      return;
    }

    var url = SITE_CONFIG.SUBMISSION_ENDPOINT + '?key=' + encodeURIComponent(SITE_CONFIG.ADMIN_SECRET);

    fetch(url)
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data && data.error) {
          document.getElementById('listArea').innerHTML =
            '<div class="admin-state admin-error">認証エラー：config.js の ADMIN_SECRET と、Apps Script側の SECRET が一致しているか確認してください。</div>';
          return;
        }
        allItems = data || [];
        currentEmail = null;
        renderQuickContacts(allItems);
        renderEmailList(allItems);
      })
      .catch(function () {
        document.getElementById('listArea').innerHTML =
          '<div class="admin-state admin-error">読み込みに失敗しました。Apps ScriptのURLやデプロイ設定をご確認ください。</div>';
      });
  }

  function isQuickContact(raw) {
    var categories;
    try { categories = JSON.parse(raw); } catch (e) { return false; }
    if (!Array.isArray(categories)) return false;
    return categories.some(function (cat) { return cat && cat.name === '無料相談フォーム'; });
  }

  function renderQuickContacts(items) {
    var area = document.getElementById('quickContactArea');
    var quickItems = items.filter(function (item) { return isQuickContact(item.categories); })
      .sort(function (a, b) { return new Date(b.date || 0) - new Date(a.date || 0); });

    if (quickItems.length === 0) {
      area.innerHTML = '';
      return;
    }

    area.innerHTML =
      '<div class="admin-quick-panel">' +
        '<h3>💬 簡易お問い合わせ（トップページのフォームより）</h3>' +
        '<p class="admin-quick-sub">' + quickItems.length + '件 ・クリックでその方の詳細を表示します</p>' +
        quickItems.map(function (item) {
          var dateStr = item.date ? new Date(item.date).toLocaleString('ja-JP') : '';
          return (
            '<button type="button" class="admin-quick-row" data-email="' + escapeHtml(item.email || '') + '">' +
              '<div class="admin-quick-top">' +
                '<span class="admin-quick-email">' + escapeHtml(item.email || '（メールアドレスなし）') + '</span>' +
                '<span class="admin-quick-date">' + escapeHtml(dateStr) + '</span>' +
              '</div>' +
              (item.notes ? '<div class="admin-quick-notes">' + escapeHtml(item.notes) + '</div>' : '') +
            '</button>'
          );
        }).join('') +
      '</div>';

    Array.prototype.forEach.call(area.querySelectorAll('.admin-quick-row'), function (btn) {
      btn.addEventListener('click', function () {
        currentEmail = btn.dataset.email;
        document.getElementById('searchInput').value = '';
        renderEmailDetail(currentEmail);
        document.getElementById('listArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  function renderEmailList(items) {
    var listArea = document.getElementById('listArea');
    var groups = {};

    items.forEach(function (item) {
      var email = item.email || '（メールアドレスなし）';
      if (!groups[email]) groups[email] = { email: email, count: 0, latest: item.date };
      groups[email].count += 1;
      if (item.date && (!groups[email].latest || new Date(item.date) > new Date(groups[email].latest))) {
        groups[email].latest = item.date;
      }
    });

    var rows = Object.keys(groups).map(function (key) { return groups[key]; })
      .sort(function (a, b) { return new Date(b.latest || 0) - new Date(a.latest || 0); });

    document.getElementById('countBadge').textContent = rows.length + '件';

    if (rows.length === 0) {
      listArea.innerHTML = '<div class="admin-state">まだご相談の送信はありません。</div>';
      return;
    }

    listArea.innerHTML = rows.map(function (row) {
      var dateStr = row.latest ? new Date(row.latest).toLocaleString('ja-JP') : '';
      return (
        '<button type="button" class="admin-email-row" data-email="' + escapeHtml(row.email) + '">' +
          '<span class="admin-email-row-email">' + escapeHtml(row.email) + '</span>' +
          '<span class="admin-email-row-meta">' + row.count + '件 ・最終 ' + escapeHtml(dateStr) + '</span>' +
        '</button>'
      );
    }).join('');

    Array.prototype.forEach.call(document.querySelectorAll('.admin-email-row'), function (btn) {
      btn.addEventListener('click', function () {
        currentEmail = btn.dataset.email;
        document.getElementById('searchInput').value = '';
        renderEmailDetail(currentEmail);
      });
    });
  }

  function attachBackButton() {
    var backBtn = document.createElement('button');
    backBtn.type = 'button';
    backBtn.className = 'btn btn-outline admin-back-btn';
    backBtn.textContent = '← メールアドレス一覧に戻る';
    backBtn.addEventListener('click', function () {
      currentEmail = null;
      document.getElementById('searchInput').value = '';
      renderEmailList(allItems);
    });
    document.getElementById('listArea').prepend(backBtn);
  }

  function renderEmailDetail(email) {
    var filtered = allItems.filter(function (item) {
      return (item.email || '（メールアドレスなし）') === email;
    });
    renderList(filtered);
    attachBackButton();
  }

  function renderList(items) {
    var listArea = document.getElementById('listArea');
    document.getElementById('countBadge').textContent = items.length + '件';

    if (items.length === 0) {
      listArea.innerHTML = '<div class="admin-state">まだご相談の送信はありません。</div>';
      return;
    }

    listArea.innerHTML = items.map(function (item, index) {
      var id = 'row-' + index + '-' + (item.date || '');
      var isHandled = handledIds.indexOf(id) !== -1;
      var dateStr = item.date ? new Date(item.date).toLocaleString('ja-JP') : '';
      var detailHtml = renderCategories(item.categories);
      var partnerHtml = renderPartnerLinks(item.categories);

      return (
        '<div class="admin-card' + (isHandled ? ' is-handled' : '') + '">' +
          '<div class="admin-top">' +
            '<span class="admin-page-tag">' + escapeHtml(item.page || '') + '</span>' +
            '<span class="admin-date">' + escapeHtml(dateStr) + '</span>' +
          '</div>' +
          '<div class="admin-email">' + escapeHtml(item.email || '') + '</div>' +
          (detailHtml ? '<div class="admin-detail">' + detailHtml + '</div>' : '') +
          partnerHtml +
          (item.notes ? '<div class="admin-notes">こだわり・補足：' + escapeHtml(item.notes) + '</div>' : '') +
          '<label class="admin-check">' +
            '<input type="checkbox" class="admin-checkbox" data-id="' + id + '" ' + (isHandled ? 'checked' : '') + '>' +
            '対応済みにする' +
          '</label>' +
          '<div style="margin-top:10px;">' +
            '<button type="button" class="btn btn-outline admin-plan-toggle" data-index="' + index + '">プランを作成する</button>' +
          '</div>' +
          '<div class="admin-plan-panel" id="planPanel-' + index + '" hidden>' +
            planRowTemplate(index) +
          '</div>' +
        '</div>'
      );
    }).join('');

    Array.prototype.forEach.call(document.querySelectorAll('.admin-checkbox'), function (checkbox) {
      checkbox.addEventListener('change', function () {
        var id = checkbox.getAttribute('data-id');
        if (checkbox.checked) {
          if (handledIds.indexOf(id) === -1) handledIds.push(id);
        } else {
          handledIds = handledIds.filter(function (x) { return x !== id; });
        }
        localStorage.setItem('gitedgift_admin_handled', JSON.stringify(handledIds));
        checkbox.closest('.admin-card').classList.toggle('is-handled', checkbox.checked);
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('.admin-plan-toggle'), function (btn) {
      btn.addEventListener('click', function () {
        var panel = document.getElementById('planPanel-' + btn.dataset.index);
        if (panel) panel.hidden = !panel.hidden;
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('.admin-plan-panel'), function (panel) {
      wirePlanPanel(panel, items[Number(panel.id.split('-')[1])]);
    });
  }

  function planRowTemplate(index) {
    return (
      '<label class="admin-plan-field">プランタイトル' +
        '<input type="text" class="plan-title-input" placeholder="例：軽井沢 1泊2日プラン">' +
      '</label>' +
      '<table class="admin-plan-table">' +
        '<thead><tr><th>時間</th><th>場所</th><th>移動手段</th><th>備考</th><th></th></tr></thead>' +
        '<tbody class="plan-rows-body">' + planRowHtml() + '</tbody>' +
      '</table>' +
      '<button type="button" class="btn btn-outline plan-add-row">＋ 行を追加</button>' +
      '<label class="admin-plan-field">ステータス' +
        '<select class="plan-status-select">' +
          '<option value="ご提案中">ご提案中</option>' +
          '<option value="調整中">調整中</option>' +
          '<option value="確定済み">確定済み</option>' +
        '</select>' +
      '</label>' +
      '<div class="admin-plan-actions">' +
        '<span class="plan-send-status" style="font-size:0.8rem;color:var(--ink-soft);"></span>' +
        '<div style="display:flex; gap:10px;">' +
          '<button type="button" class="btn btn-outline plan-pdf-btn">PDF作成</button>' +
          '<button type="button" class="btn btn-primary plan-send-btn">マイギフトに送信</button>' +
        '</div>' +
      '</div>' +
      '<div class="admin-shiori-panel" hidden>' +
        '<h4>🎒 旅のしおりカスタマイズ</h4>' +
        '<label class="admin-plan-field">サブタイトル・キャッチコピー' +
          '<input type="text" class="shiori-subtitle" placeholder="例：ふたりの記念日を彩る、特別な1泊2日">' +
        '</label>' +
        '<label class="admin-plan-field">持ち物・準備' +
          '<textarea class="shiori-packing" rows="3" placeholder="例：カメラ、温泉用タオル、動きやすい靴　など"></textarea>' +
        '</label>' +
        '<label class="admin-plan-field">担当者からのメッセージ' +
          '<textarea class="shiori-message" rows="3" placeholder="例：素敵な思い出になりますように、心を込めて準備いたしました。"></textarea>' +
        '</label>' +
        '<button type="button" class="btn btn-primary shiori-create-btn">しおりを作成する →</button>' +
      '</div>'
    );
  }

  function transportIcon(text) {
    var t = text || '';
    if (t.indexOf('飛行機') !== -1) return '✈️';
    if (t.indexOf('新幹線') !== -1 || t.indexOf('電車') !== -1) return '🚄';
    if (t.indexOf('バス') !== -1) return '🚌';
    if (t.indexOf('船') !== -1) return '🛳️';
    if (t.indexOf('車') !== -1 || t.indexOf('レンタカー') !== -1 || t.indexOf('タクシー') !== -1) return '🚗';
    if (t.indexOf('徒歩') !== -1) return '🚶';
    return '📍';
  }

  function openTravelShiori(title, subtitle, email, schedule, packing, message) {
    var rowsHtml = schedule.map(function (row) {
      var metaParts = [];
      if (row.transport) metaParts.push(row.transport);
      if (row.notes) metaParts.push(row.notes);
      return (
        '<li>' +
          '<span class="time">' + escapeHtml(row.time || '') + '</span>' +
          '<div class="body">' +
            '<div class="place">' + transportIcon(row.transport) + ' ' + escapeHtml(row.place || '') + '</div>' +
            (metaParts.length ? '<div class="meta">' + escapeHtml(metaParts.join(' ・ ')) + '</div>' : '') +
          '</div>' +
        '</li>'
      );
    }).join('');

    var html =
      '<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">' +
      '<title>' + escapeHtml(title) + '</title>' +
      '<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">' +
      '<style>' +
        '*{box-sizing:border-box;}' +
        'body{font-family:"Zen Kaku Gothic New",sans-serif;color:#2B2620;margin:0;background:#fff;}' +
        '.cover{background:linear-gradient(135deg,#F0B33D 0%,#F0BD68 100%);padding:64px 40px;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact;}' +
        '.cover .label{font-size:0.78rem;letter-spacing:0.25em;text-transform:uppercase;opacity:0.75;margin-bottom:14px;}' +
        '.cover h1{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:2rem;margin:0 0 12px;}' +
        '.cover .subtitle{font-size:1rem;}' +
        '.content{padding:36px 44px 50px;max-width:720px;margin:0 auto;}' +
        '.section-title{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:1.05rem;border-left:5px solid #D99A2B;padding-left:12px;margin:30px 0 14px;}' +
        '.timeline{list-style:none;padding:0;margin:0;}' +
        '.timeline li{display:flex;gap:18px;padding:14px 4px;border-bottom:1px dashed #ddd;}' +
        '.timeline .time{font-weight:700;color:#D99A2B;width:64px;flex-shrink:0;}' +
        '.timeline .body{flex:1;}' +
        '.timeline .place{font-weight:700;}' +
        '.timeline .meta{font-size:0.85rem;color:#6B6154;margin-top:2px;}' +
        '.message-box{background:#F4E9D3;border-radius:16px;padding:20px 24px;white-space:pre-wrap;line-height:1.8;font-size:0.92rem;}' +
        '.footer{text-align:center;padding:36px 20px;font-size:0.8rem;color:#6B6154;}' +
        '@media print{.cover{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}' +
      '</style></head><body>' +
      '<div class="cover">' +
        '<div class="label">Travel Itinerary</div>' +
        '<h1>' + escapeHtml(title) + '</h1>' +
        (subtitle ? '<p class="subtitle">' + escapeHtml(subtitle) + '</p>' : '') +
      '</div>' +
      '<div class="content">' +
        '<div class="section-title">📅 スケジュール</div>' +
        '<ul class="timeline">' + rowsHtml + '</ul>' +
        (packing ? '<div class="section-title">🎒 持ち物・準備</div><div class="message-box">' + escapeHtml(packing) + '</div>' : '') +
        (message ? '<div class="section-title">💌 担当者より</div><div class="message-box">' + escapeHtml(message) + '</div>' : '') +
      '</div>' +
      '<div class="footer">GIFTED×GIFT' + (email ? ' — ' + escapeHtml(email) : '') + '</div>' +
      '</body></html>';

    var win = window.open('', '_blank');
    if (!win) {
      alert('ポップアップがブロックされました。ブラウザの設定でポップアップを許可してください。');
      return;
    }
    win.document.open();
    win.document.write(html);
    win.document.close();
    win.focus();
    setTimeout(function () { win.print(); }, 300);
  }

  function planRowHtml() {
    return (
      '<tr class="plan-row">' +
        '<td><input type="text" class="plan-time" placeholder="10:00"></td>' +
        '<td><input type="text" class="plan-place" placeholder="東京駅"></td>' +
        '<td><input type="text" class="plan-transport" placeholder="新幹線"></td>' +
        '<td><input type="text" class="plan-notes" placeholder=""></td>' +
        '<td><button type="button" class="plan-row-remove">×</button></td>' +
      '</tr>'
    );
  }

  function collectSchedule(rowsBody) {
    return Array.prototype.map.call(rowsBody.querySelectorAll('.plan-row'), function (row) {
      return {
        time: row.querySelector('.plan-time').value.trim(),
        place: row.querySelector('.plan-place').value.trim(),
        transport: row.querySelector('.plan-transport').value.trim(),
        notes: row.querySelector('.plan-notes').value.trim(),
      };
    }).filter(function (row) {
      return row.time || row.place || row.transport || row.notes;
    });
  }

  function wirePlanPanel(panel, item) {
    var rowsBody = panel.querySelector('.plan-rows-body');

    panel.querySelector('.plan-add-row').addEventListener('click', function () {
      rowsBody.insertAdjacentHTML('beforeend', planRowHtml());
    });

    rowsBody.addEventListener('click', function (e) {
      if (!e.target.classList.contains('plan-row-remove')) return;
      var rows = rowsBody.querySelectorAll('.plan-row');
      if (rows.length <= 1) return;
      e.target.closest('.plan-row').remove();
    });

    var shioriPanel = panel.querySelector('.admin-shiori-panel');

    panel.querySelector('.plan-pdf-btn').addEventListener('click', function () {
      shioriPanel.hidden = !shioriPanel.hidden;
    });

    shioriPanel.querySelector('.shiori-create-btn').addEventListener('click', function () {
      var title = panel.querySelector('.plan-title-input').value.trim();
      var statusEl = panel.querySelector('.plan-send-status');
      var schedule = collectSchedule(rowsBody);

      if (!title) {
        statusEl.textContent = 'プランタイトルを入力してください。';
        return;
      }
      if (schedule.length === 0) {
        statusEl.textContent = 'スケジュールを1行以上入力してください。';
        return;
      }

      var subtitle = shioriPanel.querySelector('.shiori-subtitle').value.trim();
      var packing = shioriPanel.querySelector('.shiori-packing').value.trim();
      var message = shioriPanel.querySelector('.shiori-message').value.trim();

      openTravelShiori(title, subtitle, item && item.email, schedule, packing, message);
    });

    panel.querySelector('.plan-send-btn').addEventListener('click', function () {
      var title = panel.querySelector('.plan-title-input').value.trim();
      var status = panel.querySelector('.plan-status-select').value;
      var statusEl = panel.querySelector('.plan-send-status');

      if (!item || !item.email) {
        statusEl.textContent = 'この依頼にメールアドレスがないため送信できません。';
        return;
      }
      if (!title) {
        statusEl.textContent = 'プランタイトルを入力してください。';
        return;
      }

      var schedule = collectSchedule(rowsBody);

      if (schedule.length === 0) {
        statusEl.textContent = 'スケジュールを1行以上入力してください。';
        return;
      }

      if (!SITE_CONFIG.SUBMISSION_ENDPOINT || SITE_CONFIG.SUBMISSION_ENDPOINT.indexOf('script.google.com') === -1) {
        statusEl.textContent = 'config.js の SUBMISSION_ENDPOINT が未設定です。';
        return;
      }

      fetch(SITE_CONFIG.SUBMISSION_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          type: 'plan',
          email: item.email,
          title: title,
          page: item.page || '',
          schedule: schedule,
          status: status,
        }),
      }).then(function () {
        statusEl.textContent = '送信しました。マイギフトに反映されます。';
      }).catch(function () {
        statusEl.textContent = '送信に失敗しました。時間をおいて再度お試しください。';
      });
    });
  }

  document.getElementById('searchInput').addEventListener('input', function (e) {
    var q = e.target.value.trim().toLowerCase();

    if (currentEmail) {
      var scope = allItems.filter(function (item) {
        return (item.email || '（メールアドレスなし）') === currentEmail;
      });
      var scopedFiltered = !q ? scope : scope.filter(function (item) {
        return (
          (item.page || '').toLowerCase().indexOf(q) !== -1 ||
          (item.categories || '').toLowerCase().indexOf(q) !== -1 ||
          (item.notes || '').toLowerCase().indexOf(q) !== -1
        );
      });
      renderList(scopedFiltered);
      attachBackButton();
      return;
    }

    if (!q) { renderEmailList(allItems); return; }
    var filtered = allItems.filter(function (item) {
      return (
        (item.page || '').toLowerCase().indexOf(q) !== -1 ||
        (item.email || '').toLowerCase().indexOf(q) !== -1 ||
        (item.categories || '').toLowerCase().indexOf(q) !== -1 ||
        (item.notes || '').toLowerCase().indexOf(q) !== -1
      );
    });
    renderEmailList(filtered);
  });

      { name: 'Agoda', url: 'https://px.a8.net/svt/ejp?a8mat=4BC3YJ+ATDIEQ+4X1W+NTRMQ' },

    ],
    '移動手段': [

      { name: 'エアトリ（夜行・高速バス）', url: 'https://px.a8.net/svt/ejp?a8mat=4BC3YJ+CYRV1U+AD2+3H18R6' },
      { name: 'Omio（ヨーロッパ交通予約）', url: 'https://omio.sjv.io/c/1284660/846860/7385' },
    ],
    'アクティビティ': [
      { name: 'らんらんツアー（沖縄）', url: 'https://px.a8.net/svt/ejp?a8mat=4BC36R+3UQ0QA+5R8A+631SY' },

      { name: '旅物語', url: 'https://px.a8.net/svt/ejp?a8mat=4BC36R+7CCHDE+15A4+1NJRXE' },
    ],
    '花束': [
      { name: '胡蝶蘭専門店 ランノハナドットコム', url: 'https://px.a8.net/svt/ejp?a8mat=4BC36R+526NW2+4L8W+601S2' },
      { name: 'Flower&Plants tette', url: 'https://px.a8.net/svt/ejp?a8mat=4BC3YK+ABII9E+5DVQ+5YJRM' },

    '添えるギフト': [

    ],
    '物品': [
      { name: 'JTBショッピング', url: 'https://px.a8.net/svt/ejp?a8mat=4BC36R+9T22IA+3YCQ+61JSI' },
      { name: 'よろずやマルシェ', url: 'https://px.a8.net/svt/ejp?a8mat=4BC36R+6RIB76+22DS+BZ8OY' },
    ],
  };

  function findPartnerLinks(categoryName) {
    var matched = [];
    Object.keys(PARTNER_LINKS).forEach(function (keyword) {
      if (categoryName.indexOf(keyword) !== -1) {
        matched = matched.concat(PARTNER_LINKS[keyword]);
      }
    });
    return matched;
  }

  function renderPartnerLinks(raw) {
    var categories;
    try { categories = JSON.parse(raw); } catch (e) { return ''; }
    if (!Array.isArray(categories)) return '';

    var seen = {};
    var links = [];
    categories.forEach(function (cat) {
      var name = (cat && cat.name) || '';
      findPartnerLinks(name).forEach(function (link) {
        if (seen[link.url]) return;
        seen[link.url] = true;
        links.push(link);
      });
    });

    if (links.length === 0) return '';

    var buttons = links.map(function (link) {
      return (
        '<a class="admin-partner-link" href="' + escapeHtml(link.url) + '" target="_blank" rel="noopener sponsored">' +
          escapeHtml(link.name) + ' ↗' +
        '</a>'
      );
    }).join('');

    return (
      '<div class="admin-partner-panel">' +
        '<div class="admin-partner-label">提携サイトで候補を探す</div>' +
        '<div class="admin-partner-links">' + buttons + '</div>' +
      '</div>'
    );
  }

  function renderCategories(raw) {
    var categories;
    try { categories = JSON.parse(raw); } catch (e) { return ''; }
    if (!Array.isArray(categories)) return '';

    return categories
      .filter(function (cat) { return cat && cat.fields && Object.keys(cat.fields).length > 0; })
      .map(function (cat) {
        var rows = Object.keys(cat.fields).map(function (key) {
          var value = cat.fields[key];
          if (Array.isArray(value)) value = value.join('、');
          return (
            '<div class="admin-field-row">' +
              '<span class="admin-field-label">' + escapeHtml(key) + '</span>' +
              '<span class="admin-field-value">' + escapeHtml(String(value)) + '</span>' +
            '</div>'
          );
        }).join('');

        return (
          '<div class="admin-category">' +
            '<div class="admin-category-name">' + escapeHtml(cat.name || '') + '</div>' +
            rows +
          '</div>'
        );
      })
      .join('');
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
