<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>管理ページ | GITEDGIFT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Netlify Identity: 会員（招待した管理者）だけがログインできるようにする仕組み -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
  :root{
    --cream:#FBF6EC; --paper:#F3E8D3; --ink:#3C362B; --ink-soft:#6B6154;
    --gold:#F2A93D; --gold-deep:#D9861F; --sage:#7C9473; --sage-deep:#5F7554;
    --line:rgba(60,54,43,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--cream); color:var(--ink); font-family:'Zen Kaku Gothic New',sans-serif; line-height:1.7;}
  h1,h2{font-family:'Zen Maru Gothic',sans-serif; font-weight:700; margin:0;}
  .wrap{max-width:1040px; margin:0 auto; padding:40px 24px 80px;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  header h1{font-size:1.4rem;}
  .user-chip{font-size:0.85rem; color:var(--ink-soft); display:flex; align-items:center; gap:12px;}
  .btn{background:var(--ink); color:var(--cream); border:none; padding:10px 20px; border-radius:24px; font-weight:700; font-size:0.85rem; cursor:pointer;}
  .btn:hover{background:var(--gold-deep); color:var(--ink);}
  .btn-outline{background:transparent; color:var(--ink); border:1px solid var(--line); padding:9px 18px; border-radius:24px; font-size:0.85rem; cursor:pointer;}

  /* ログイン前ゲート画面 */
  #gate{min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:20px; text-align:center; padding:24px;}
  #gate p{color:var(--ink-soft); max-width:38ch;}

  /* ダッシュボード */
  #dashboard{display:none;}
  .toolbar{display:flex; gap:12px; align-items:center; margin:28px 0 20px; flex-wrap:wrap;}
  .toolbar input[type="search"]{
    flex:1; min-width:200px; padding:12px 16px; border-radius:12px; border:1px solid var(--line);
    font-family:inherit; font-size:0.92rem; background:#fff;
  }
  .count-badge{font-size:0.82rem; color:var(--ink-soft);}
  .sub-card{background:#fff; border:1px solid var(--line); border-radius:18px; padding:20px 22px; margin-bottom:14px; display:flex; gap:18px; align-items:flex-start;}
  .sub-card.handled{opacity:0.55;}
  .sub-check{margin-top:4px; flex-shrink:0; width:20px; height:20px; accent-color:var(--sage);}
  .sub-main{flex:1; min-width:0;}
  .sub-top{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:8px;}
  .sub-name{font-weight:700; font-size:1.05rem;}
  .sub-date{font-size:0.78rem; color:var(--ink-soft); white-space:nowrap;}
  .sub-email{font-size:0.85rem; color:var(--gold-deep); margin-bottom:8px; word-break:break-all;}
  .sub-message{font-size:0.9rem; color:var(--ink); white-space:pre-wrap;}
  .empty-state, .error-state, .loading-state{text-align:center; color:var(--ink-soft); padding:60px 20px;}
  .error-state{color:#b3452f;}
</style>
</head>
<body>

<!-- ログイン前に表示するゲート画面 -->
<div id="gate">
  <h1>GITEDGIFT 管理ページ</h1>
  <p>このページは招待された管理者だけが閲覧できます。ログインしてください。</p>
  <button class="btn" onclick="netlifyIdentity.open()">ログイン</button>
</div>

<!-- ログイン後のダッシュボード -->
<div id="dashboard">
  <div class="wrap">
    <header>
      <h1>ご相談一覧</h1>
      <div class="user-chip">
        <span id="userEmail"></span>
        <button class="btn-outline" onclick="netlifyIdentity.logout()">ログアウト</button>
      </div>
    </header>

    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="お名前・メールアドレス・内容で検索">
      <span class="count-badge" id="countBadge"></span>
    </div>

    <div id="listArea">
      <div class="loading-state">読み込み中です…</div>
    </div>
  </div>
</div>

<script>
  var allSubmissions = [];
  var handledIds = JSON.parse(localStorage.getItem('gitedgift_handled') || '[]');

  netlifyIdentity.on('init', function (user) {
    if (user) { showDashboard(user); } else { showGate(); }
  });
  netlifyIdentity.on('login', function (user) {
    showDashboard(user);
    netlifyIdentity.close();
  });
  netlifyIdentity.on('logout', function () {
    showGate();
  });
  netlifyIdentity.init();

  function showGate() {
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
  }

  function showDashboard(user) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('userEmail').textContent = user.email;
    loadSubmissions(user);
  }

  function loadSubmissions(user) {
    var token = user.token && user.token.access_token;
    fetch('/.netlify/functions/get-submissions', {
      headers: { Authorization: 'Bearer ' + token }
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        if (!result.ok) {
          renderError(result.data.error || '取得に失敗しました。');
          return;
        }
        allSubmissions = (result.data.submissions || []).sort(function (a, b) {
          return new Date(b.created_at) - new Date(a.created_at);
        });
        renderList(allSubmissions);
      })
      .catch(function () {
        renderError('通信エラーが発生しました。時間をおいて再度お試しください。');
      });
  }

  function renderError(message) {
    document.getElementById('listArea').innerHTML =
      '<div class="error-state">' + escapeHtml(message) + '</div>';
  }

  function renderList(items) {
    var listArea = document.getElementById('listArea');
    document.getElementById('countBadge').textContent = items.length + '件';

    if (items.length === 0) {
      listArea.innerHTML = '<div class="empty-state">まだご相談の送信はありません。</div>';
      return;
    }

    listArea.innerHTML = items.map(function (item) {
      var d = item.data || {};
      var isHandled = handledIds.indexOf(item.id) !== -1;
      var date = new Date(item.created_at);
      var dateStr = date.toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
      return (
        '<div class="sub-card' + (isHandled ? ' handled' : '') + '">' +
          '<input type="checkbox" class="sub-check" data-id="' + item.id + '" ' + (isHandled ? 'checked' : '') + '>' +
          '<div class="sub-main">' +
            '<div class="sub-top">' +
              '<span class="sub-name">' + escapeHtml(d.name || '（お名前未入力）') + '</span>' +
              '<span class="sub-date">' + dateStr + '</span>' +
            '</div>' +
            '<div class="sub-email">' + escapeHtml(d.email || '') + '</div>' +
            '<div class="sub-message">' + escapeHtml(d.message || '（相談内容の記載なし）') + '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    Array.prototype.forEach.call(document.querySelectorAll('.sub-check'), function (checkbox) {
      checkbox.addEventListener('change', function () {
        var id = checkbox.getAttribute('data-id');
        if (checkbox.checked) {
          if (handledIds.indexOf(id) === -1) handledIds.push(id);
        } else {
          handledIds = handledIds.filter(function (x) { return x !== id; });
        }
        localStorage.setItem('gitedgift_handled', JSON.stringify(handledIds));
        checkbox.closest('.sub-card').classList.toggle('handled', checkbox.checked);
      });
    });
  }

  document.getElementById('searchInput').addEventListener('input', function (e) {
    var q = e.target.value.trim().toLowerCase();
    if (!q) { renderList(allSubmissions); return; }
    var filtered = allSubmissions.filter(function (item) {
      var d = item.data || {};
      return (
        (d.name || '').toLowerCase().indexOf(q) !== -1 ||
        (d.email || '').toLowerCase().indexOf(q) !== -1 ||
        (d.message || '').toLowerCase().indexOf(q) !== -1
      );
    });
    renderList(filtered);
  });

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>

</body>
</html>
