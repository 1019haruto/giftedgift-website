<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>マイページ ｜ GIFTED×GIFT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="brand">
      <img src="images/logo-mark-transparent.png" alt="GIFTED×GIFT" class="brand-mark">
      <span class="brand-name">GIFTED<span class="brand-x">×</span>GIFT</span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="メニューを開く" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav" id="siteNav">
      <a href="index.html#services">サービス</a>
      <a href="index.html#travel">ギフト×プラン</a>
      <a href="index.html#flow">ご利用の流れ</a>
      <a href="index.html#about">初めてご利用の方へ</a>
      <a href="mypage.html" class="nav-cta">マイページ</a>
    </nav>
  </div>
</header>

<main>
  <section class="mypage-hero wrap">
    <p class="section-label">My Page</p>
    <h1>おかえりなさい。</h1>
    <p>これまでのご相談内容と、担当からのご提案をこちらでご確認いただけます。</p>
  </section>

  <section class="mypage-list wrap">
    <h2 class="mypage-heading">ご提案・ギフト一覧</h2>

    <div id="emailGate" class="proposal-email-gate" hidden>
      <p>ご相談時にご入力いただいたメールアドレスを入力してください。</p>
      <div class="proposal-email-gate-row">
        <input type="email" id="myEmailInput" placeholder="example@mail.com">
        <button type="button" class="btn btn-primary" id="myEmailSubmit">確認する</button>
      </div>
    </div>

    <div id="planList">
      <div class="admin-state">読み込み中です…</div>
    </div>
  </section>

  <section class="mypage-cta wrap">
    <div class="mypage-cta-inner">
      <div>
        <h2>新しいご相談をする</h2>
        <p>贈りたい相手や機会が新しくできたら、こちらからお気軽にご依頼ください。</p>
      </div>
      <div class="mypage-cta-links">
        <a href="gift-selection.html" class="btn btn-outline">ギフト選定</a>
        <a href="gift-travel.html" class="btn btn-outline">ギフト×プラン</a>
        <a href="one-day-plan.html" class="btn btn-outline">1Dayプラン</a>
        <a href="other-services.html" class="btn btn-primary">その他のご相談</a>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-brand">
      <img src="images/logo-mark-transparent.png" alt="GIFTED×GIFT" class="brand-mark">
      <span class="brand-name brand-name--small">GIFTED<span class="brand-x">×</span>GIFT</span>
    </div>
    <div class="footer-meta"><p>&copy; 2026 GIFTED×GIFT. All rights reserved.</p></div>
  </div>
</footer>

<script src="config.js"></script>
<script src="script.js"></script>
<script>
(function () {
  var emailGate = document.getElementById('emailGate');
  var myEmailInput = document.getElementById('myEmailInput');
  var myEmailSubmit = document.getElementById('myEmailSubmit');
  var planList = document.getElementById('planList');

  function statusClass(status) {
    if (status === '確定済み') return 'status-badge--done';
    if (status === '調整中') return 'status-badge--progress';
    return 'status-badge--pending';
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderSchedule(raw) {
    var rows;
    try { rows = JSON.parse(raw); } catch (e) { rows = []; }
    if (!Array.isArray(rows) || rows.length === 0) return '';

    var body = rows.map(function (row) {
      return (
        '<tr>' +
          '<td>' + escapeHtml(row.time || '') + '</td>' +
          '<td>' + escapeHtml(row.place || '') + '</td>' +
          '<td>' + escapeHtml(row.transport || '') + '</td>' +
          '<td>' + escapeHtml(row.notes || '') + '</td>' +
        '</tr>'
      );
    }).join('');

    return (
      '<table class="proposal-schedule" hidden>' +
        '<thead><tr><th>時間</th><th>場所</th><th>移動手段</th><th>備考</th></tr></thead>' +
        '<tbody>' + body + '</tbody>' +
      '</table>'
    );
  }

  function renderPlans(items) {
    if (items.length === 0) {
      planList.innerHTML = '<div class="mypage-state">まだご提案はありません。ご相談いただくと、こちらに表示されます。</div>';
      return;
    }

    planList.innerHTML = items.map(function (item) {
      var dateStr = item.date ? new Date(item.date).toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' }) : '';
      var scheduleHtml = renderSchedule(item.schedule);

      return (
        '<div class="proposal-card">' +
          '<div class="proposal-main">' +
            '<span class="proposal-tag">' + escapeHtml(item.page || '') + '</span>' +
            '<h3>' + escapeHtml(item.title || '') + '</h3>' +
            scheduleHtml +
          '</div>' +
          '<div class="proposal-side">' +
            '<span class="status-badge ' + statusClass(item.status) + '">' + escapeHtml(item.status || 'ご提案中') + '</span>' +
            '<span class="proposal-date">更新日：' + escapeHtml(dateStr) + '</span>' +
            '<a href="#" class="proposal-link proposal-toggle">詳細を見る →</a>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    Array.prototype.forEach.call(document.querySelectorAll('.proposal-toggle'), function (link) {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        var card = link.closest('.proposal-card');
        var table = card.querySelector('.proposal-schedule');
        if (table) {
          table.hidden = !table.hidden;
          link.textContent = table.hidden ? '詳細を見る →' : '閉じる ↑';
        }
      });
    });
  }

  function loadPlans(email) {
    planList.innerHTML = '<div class="mypage-state">読み込み中です…</div>';

    if (typeof SITE_CONFIG === 'undefined' || !SITE_CONFIG.SUBMISSION_ENDPOINT ||
        SITE_CONFIG.SUBMISSION_ENDPOINT.indexOf('script.google.com') === -1) {
      planList.innerHTML = '<div class="mypage-state">config.js の SUBMISSION_ENDPOINT が未設定のため読み込めません。</div>';
      return;
    }

    var url = SITE_CONFIG.SUBMISSION_ENDPOINT + '?action=myplans&email=' + encodeURIComponent(email);
    fetch(url)
      .then(function (res) { return res.json(); })
      .then(function (data) { renderPlans(data || []); })
      .catch(function () {
        planList.innerHTML = '<div class="mypage-state">読み込みに失敗しました。時間をおいて再度お試しください。</div>';
      });
  }

  var savedEmail = localStorage.getItem('gitedgift_user_email');
  if (savedEmail) {
    loadPlans(savedEmail);
  } else {
    emailGate.hidden = false;
    planList.innerHTML = '';
  }

  if (myEmailSubmit) {
    myEmailSubmit.addEventListener('click', function () {
      var email = myEmailInput.value.trim();
      if (!email) {
        alert('メールアドレスを入力してください。');
        return;
      }
      localStorage.setItem('gitedgift_user_email', email);
      emailGate.hidden = true;
      loadPlans(email);
    });
  }
})();
</script>
</body>
</html>
